<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="60" y1="20" x2="452" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B6BFF"/>
      <stop offset="0.55" stop-color="#6B3FD9"/>
      <stop offset="1" stop-color="#4B2A9E"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 90) rotate(90) scale(320 380)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFEAFF"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD873"/>
      <stop offset="1" stop-color="#F0A93B"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="softSmall" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- fondo -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#sheen)"/>

  <!-- guilloché sutil, como el grabado de un billete -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <path d="M-20,60 L532,220" /><path d="M-20,110 L532,270" /><path d="M-20,160 L532,320" />
    <path d="M-20,210 L532,370" /><path d="M-20,260 L532,420" /><path d="M-20,310 L532,470" />
  </g>

  <!-- sombra de las barras -->
  <ellipse cx="266" cy="392" rx="132" ry="16" fill="#2E1A80" opacity="0.35" filter="url(#soft)"/>

  <!-- barras (tendencia ascendente) -->
  <rect x="164" y="286" width="56" height="106" rx="18" fill="url(#bar)"/>
  <rect x="236" y="234" width="56" height="158" rx="18" fill="url(#bar)" opacity="0.96"/>
  <rect x="308" y="170" width="56" height="222" rx="18" fill="url(#bar)" opacity="0.92"/>

  <!-- sombra de la moneda -->
  <ellipse cx="345" cy="182" rx="40" ry="10" fill="#2E1A80" opacity="0.25" filter="url(#softSmall)"/>

  <!-- moneda -->
  <circle cx="345" cy="152" r="46" fill="url(#coin)"/>
  <circle cx="345" cy="152" r="46" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.55"/>
  <path d="M323,130 A46,46 0 0 1 366,124" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
</svg>
